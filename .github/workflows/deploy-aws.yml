name: Deploy to AWS (S3 + CloudFront)

# Publica automaticamente a cada push/merge na main, e também
# permite disparo manual pela aba Actions (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # Em pull request roda SÓ o job de testes (o deploy tem condição de branch).
  pull_request:

# Padrão mínimo: cada job declara o que precisa a mais.
permissions:
  contents: read

concurrency:
  # Por branch: um PR não cancela um deploy da main em andamento.
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rede de segurança: nada é publicado se isto falhar (o deploy tem `needs`).
  # Sem rede externa de negócio: os testes não falam com AWS, Firebase,
  # InfinitePay nem e-mail, e este job não recebe nenhum segredo.
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # o mesmo das funções na AWS (nodejs22.x)

      - name: Instalar dependências de teste
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes (npm test)
        run: npm test

      - name: Vulnerabilidades em dependências (npm audit)
        run: npm audit --audit-level=high

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt e validate (sem acessar a AWS)
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  deploy:
    needs: testes
    # Só a main publica. Em pull request este job nem começa.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # necessário para autenticar via OIDC (sem chave estática)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (gera dist/)
        env:
          FIREBASE_API_KEY:   ${{ secrets.FIREBASE_API_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
        run: node build.js

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      # Antes do site: o front novo nunca chama uma API desatualizada.
      # Uma função nova em functions/ precisa existir no Terraform
      # (infra/api.tf) antes do merge — senão este passo falha de propósito.
      - name: Publicar funções (Lambda)
        run: |
          (cd functions && zip -qr "$GITHUB_WORKSPACE/functions.zip" .)
          for f in functions/*.js; do
            fn="sp-car-clean-$(basename "$f" .js)"
            echo "→ $fn"
            aws lambda update-function-code --function-name "$fn" \
              --zip-file "fileb://functions.zip" --output text --query LastUpdateStatus
          done

      - name: Sync para o S3
        run: |
          # Sobe tudo com cache longo por padrão...
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=604800"

          # ...mas o index.html sempre revalida (nunca fica preso a versão antiga).
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

          # PWA: o service worker e os manifestos dos apps também revalidam sempre
          # (senão o app instalado demora a ver a versão nova), com o tipo certo.
          aws s3 cp dist/sw.js "s3://${{ secrets.S3_BUCKET }}/sw.js" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/javascript"
          for m in manifest.webmanifest admin.webmanifest; do
            aws s3 cp "dist/$m" "s3://${{ secrets.S3_BUCKET }}/$m" \
              --cache-control "public, max-age=0, must-revalidate" \
              --content-type "application/manifest+json"
          done

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
