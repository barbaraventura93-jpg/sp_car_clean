name: Deploy to Firebase

# DESATIVADO (2026-07-25). O host de produção é o Netlify (spcarclean.com.br),
# onde as variáveis de ambiente já estão configuradas e o deploy funciona. Este
# workflow do Firebase Hosting nunca chegou a rodar desde que o passo `build.js`
# passou a exigir secrets DO GITHUB (FIREBASE_API_KEY, FIREBASE_VAPID_KEY,
# EMAILJS_SERVICE_ID, EMAILJS_PUBLIC_KEY, FIREBASE_SERVICE_ACCOUNT) — que existem
# só no Netlify, não no cofre do GitHub Actions. Para religar: cadastre esses
# secrets em Settings → Secrets and variables → Actions e troque o gatilho abaixo
# de volta para `push: { branches: [main] }`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Roda o mesmo build do Netlify: injeta as chaves e copia os arquivos do PWA
      # (manifest, service workers) para dist/. Sem isto o Firebase Hosting recebia um
      # index.html com placeholders %%...%% e sem o PWA.
      - name: Build project
        run: node build.js
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_VAPID_KEY:  ${{ secrets.FIREBASE_VAPID_KEY }}
          EMAILJS_SERVICE_ID:  ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sp-car-clean
